<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Surpresa de Amor 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      font-family:Arial, Helvetica, sans-serif;
      background:#ffe4e1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      height:100vh;
      position:relative;
      text-align:center;
    }

    #mensagem{
      position:absolute;
      top:15px;
      width:100%;
      font-size:clamp(22px,4vw,42px);
      color:#d6336c;
      font-weight:bold;
      text-shadow:1px 1px 2px white;
      padding:0 15px;
      line-height:1.4;
    }

    #botao{
      padding:18px 35px;
      font-size:24px;
      border:none;
      border-radius:12px;
      background:#ff69b4;
      color:white;
      cursor:pointer;
      transition:.3s;
      z-index:2;
    }

    #botao:hover{
      transform:scale(1.05);
      background:#ff4fa4;
    }

    #gato{
      margin-top:25px;
      display:none;
      width:320px;
      max-width:90%;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,.25);
      z-index:2;
    }

    .heart{
      position:absolute;
      bottom:-40px;
      font-size:35px;
      animation:subir 4s linear forwards;
      pointer-events:none;
    }

    @keyframes subir{
      0%{
        transform:translateY(0) scale(1);
        opacity:1;
      }

      100%{
        transform:translateY(-110vh) scale(.4);
        opacity:0;
      }
    }
  </style>
</head>

<body>

<div id="mensagem">
    Feliz <span id="contador"></span> de namoro! 💖
</div>

<button id="botao">
    Clique com carinho!
</button>

<img id="gato" src="gatinho.jpg" alt="Gatinho">

<script>

const botao = document.getElementById("botao");
const gato = document.getElementById("gato");
const contador = document.getElementById("contador");

// Data de início do namoro
// (ANO, MÊS-1, DIA, HORA, MINUTO, SEGUNDO)
const dataInicio = new Date(2024, 6, 7, 0, 0, 0);

function atualizarContador(){

    const agora = new Date();

    let diferenca = agora.getTime() - dataInicio.getTime();

    if(diferenca < 0){
        contador.textContent = "0 dias, 0 horas, 0 minutos, 0 segundos";
        return;
    }

    const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
    diferenca %= (1000 * 60 * 60 * 24);

    const horas = Math.floor(diferenca / (1000 * 60 * 60));
    diferenca %= (1000 * 60 * 60);

    const minutos = Math.floor(diferenca / (1000 * 60));
    diferenca %= (1000 * 60);

    const segundos = Math.floor(diferenca / 1000);

    contador.textContent =
    `${dias} dias, ${horas} horas, ${minutos} minutos, ${segundos} segundos`;
}

atualizarContador();
setInterval(atualizarContador,1000);

// Corações
function criarCoracao(){

    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random()*window.innerWidth + "px";
    heart.style.fontSize = (20 + Math.random()*30) + "px";

    document.body.appendChild(heart);

    heart.addEventListener("animationend",()=>{
        heart.remove();
    });

}

setInterval(criarCoracao,300);

// Botão
botao.addEventListener("click",()=>{

    botao.style.display="none";
    gato.style.display="block";

});

</script>

</body>
</html>
