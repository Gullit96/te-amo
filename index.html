<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Surpresa de Amor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #ffe4e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
      text-align: center;
    }

    #mensagem {
      position: absolute;
      top: 10px;
      width: 100%;
      font-size: 6vw;
      color: #d6336c;
      font-weight: bold;
      text-shadow: 1px 1px 2px #fff;
      padding: 0 10px;
    }

    #botao {
      padding: 4vh 8vw;
      font-size: 6vw;
      border: none;
      border-radius: 12px;
      background-color: #ff69b4;
      cursor: pointer;
      z-index: 1;
      margin-top: 50px;
    }

    #gato {
      margin-top: 20px;
      display: none;
      max-width: 90%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1;
    }

    .heart {
      position: absolute;
      bottom: -50px;
      font-size: 8vw;
      color: red;
      opacity: 0.8;
      animation: floatUp 4s linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-600px) scale(0.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div id="mensagem">Feliz <span id="contador">0 dias, 0 horas, 0 minutos, 0 segundos</span> de namoro! 💖</div>
  <button id="botao">Clique com carinho!</button>
  <img id="gato" src="gatinho.jpg" alt="Gatinho fofo" />

  <script>
    const botao = document.getElementById('botao');
    const gato = document.getElementById('gato');
    const contadorSpan = document.getElementById('contador');

    // Data de início do namoro
    const dataInicio = new Date('2024-07-07T00:00:00');

    function atualizarContador() {
      const agora = new Date();
      const diffMs = agora - dataInicio;

      const dias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const horas = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
      const minutos = Math.floor((diffMs / (1000 * 60)) % 60);
      const segundos = Math.floor((diffMs / 1000) % 60);

      contadorSpan.innerHTML = `${dias} dias, ${horas} horas, ${minutos} minutos, ${segundos} segundos`;
    }

    // Atualiza o contador a cada segundo
    setInterval(atualizarContador, 1000);
    atualizarContador();

    function criarCoração() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerHTML = '❤️';

      const posX = Math.random() * window.innerWidth;
      heart.style.left = `${posX}px`;
      document.body.appendChild(heart);
      heart.addEventListener('animationend', () => {
        heart.remove();
      });
    }
    setInterval(criarCoração, 300);

    botao.addEventListener('click', () => {
      botao.style.display = 'none';
      gato.style.display = 'block';
    });
  </script>
</body>
</html>
